<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UChicago ACM</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at center, #800404 0%, #700303 40%, #5a0202 100%);
      color: #ffffff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .landing-container {
      text-align: center;
      width: min(920px, calc(100vw - 40px));
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      animation-delay: 0.1s;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin-bottom: 36px;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 0.3s;
    }

    .landing-logo {
      width: 180px;
      height: auto;
      flex: 0 0 auto;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.3));
    }

    .partnership-mark {
      color: rgba(255, 255, 255, 0.55);
      font-size: 44px;
      font-weight: 300;
      line-height: 1;
    }

    .visa-logo {
      position: relative;
      width: 180px;
      height: 180px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.18));
    }

    .visa-animation {
      position: absolute;
      inset: 0;
    }

    .visa-animation svg {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .visa-fallback {
      color: #1634cb;
      font-size: 48px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -4px;
      transition: opacity 0.2s ease;
    }

    .visa-logo.is-loaded .visa-fallback {
      opacity: 0;
    }

    .landing-title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeIn 0.7s ease forwards;
      animation-delay: 0.6s;
    }

    .landing-name {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeIn 0.7s ease forwards;
      animation-delay: 0.75s;
    }

    .landing-subtitle {
      font-size: 16px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeIn 0.7s ease forwards;
      animation-delay: 0.9s;
    }

    .enter-btn {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 14px 40px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
      animation-delay: 1.2s;
    }

    .enter-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @media (max-width: 640px) {
      .brand-lockup {
        gap: 18px;
        margin-bottom: 30px;
      }

      .landing-logo,
      .visa-logo {
        width: 116px;
        height: 116px;
      }

      .partnership-mark {
        font-size: 32px;
      }

      .landing-title {
        font-size: 11px;
        letter-spacing: 2.4px;
      }

      .landing-name {
        font-size: clamp(27px, 8vw, 36px);
      }

      .landing-subtitle {
        margin-bottom: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <div class="brand-lockup" aria-label="UChicago ACM in partnership with Visa">
      <img src="images/logo.png" alt="UChicago ACM logo" class="landing-logo">
      <span class="partnership-mark" aria-hidden="true">&times;</span>
      <div class="visa-logo" id="visa-logo" role="img" aria-label="Visa logo">
        <span class="visa-fallback" aria-hidden="true">VISA</span>
        <div class="visa-animation" id="visa-animation" aria-hidden="true"></div>
      </div>
    </div>
    <p class="landing-title">University of Chicago</p>
    <h1 class="landing-name">Association for Computing Machinery</h1>
    <p class="landing-subtitle">Student Chapter</p>
    <a href="main.html" class="enter-btn" id="enter-btn">Enter</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>
  <script>
    if (window.lottie) {
      const visaLogo = document.getElementById('visa-logo');
      const visaAnimation = lottie.loadAnimation({
        container: document.getElementById('visa-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'images/visa-logo.json'
      });

      visaAnimation.addEventListener('DOMLoaded', function () {
        visaLogo.classList.add('is-loaded');
      });
    }

    document.getElementById('enter-btn').addEventListener('click', function () {
      document.cookie = 'landing_page_seen=true; expires=Fri, 31 Dec 9999 23:59:59 GMT; path=/';
    });
  </script>
</body>
</html>
